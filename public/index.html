<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>持仓管理</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <nav class="tab-bar">
      <div class="tab active" data-tab="portfolio">持仓</div>
      <div class="tab" data-tab="analysis">分析</div>
      <div class="tab" data-tab="news">新闻</div>
      <div class="tab" data-tab="manage">管理</div>
    </nav>

    <main class="content">
      <section id="tab-portfolio" class="tab-content active">
        <div class="page-header">
          <h1>持仓总览</h1>
          <div class="summary-grid">
            <div class="summary-item">
              <span class="summary-label">总市值</span>
              <span id="total-value" class="summary-value">--</span>
            </div>
            <div class="summary-item">
              <span class="summary-label">总盈亏</span>
              <span id="total-profit" class="summary-value">--</span>
            </div>
            <div class="summary-item">
              <span class="summary-label">收益率</span>
              <span id="total-profit-pct" class="summary-value">--</span>
            </div>
          </div>
        </div>
        <div id="portfolio-list" class="card-list"></div>
        <button class="btn-primary" onclick="refreshQuotes()">刷新行情</button>
      </section>

      <section id="tab-analysis" class="tab-content">
        <div class="search-bar">
          <input type="text" id="analysis-code" placeholder="搜索股票代码分析">
          <button onclick="searchAnalysis()">分析</button>
        </div>
        <div id="analysis-list"></div>
      </section>

      <section id="tab-news" class="tab-content">
        <div class="search-bar">
          <input type="text" id="news-code" placeholder="搜索股票代码查新闻">
          <button onclick="searchNews()">搜索</button>
        </div>
        <div id="news-list"></div>
      </section>

      <section id="tab-manage" class="tab-content">
        <div class="section-title">添加持仓</div>
        <form id="add-form" class="card" onsubmit="addStock(event)">
          <div class="form-row">
            <input type="text" id="input-code" placeholder="股票代码" required>
            <input type="text" id="input-name" placeholder="名称" required>
          </div>
          <div class="form-row">
            <input type="number" id="input-shares" placeholder="数量(股)" required>
            <input type="number" id="input-cost" step="0.001" placeholder="成本价" required>
          </div>
          <button type="submit" class="btn-primary">添加持仓</button>
        </form>
        <div class="section-title">持仓列表</div>
        <div id="manage-list"></div>
      </section>
    </main>
  </div>

  <a href="/" class="switch-btn" title="切换应用">⚡</a>
  <script src="/js/app.js"></script>
</body>
</html>
